[package]
name = "inmem-memo"
version = "1.3.0"
description = "Ultra-Fast In-Memory Scratchpad Memo App"
authors = ["Antigravity"]
edition = "2021"

[lib]
name = "inmem_memo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-global-shortcut = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
